# This is a basic workflow to help you get started with Actions

name: CI

permissions:
  contents: read

# Controls when the action will run. Triggers the workflow on push or pull request events
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  locale-keys:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Check locale keys
      run: python3 scripts/check_locale_keys.py --supported-codes-file scripts/selectable-locale-codes.json

    - name: Test locale key checker
      run: python3 -m unittest discover -s scripts/tests -p 'test_check_locale_keys.py'

  linters:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Set node version
    strategy:
      matrix:
        node-version: [24.22.0]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Node ${{ matrix.node-version }}
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: npm install
      run: npm ci --ignore-scripts --no-audit

    - name: pass linters
      run: npm run scss-lint

  unit-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Set node version
    strategy:
      matrix:
        node-version: [24.22.0]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Node ${{ matrix.node-version }}
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: npm install
      run: npm ci --ignore-scripts --no-audit

    - name: Check locale ICU format
      run: npm run check:locale-format

    - name: pass unit test
      run: npm run ci:test
